<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Drills — Emergency Party Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="assets/icg-logo.png">
</head>
<body>

<header class="app-header">
  <div class="wrap header-inner">
    <img src="assets/icg-logo.png" alt="भारतीय तटरक्षक — Indian Coast Guard" class="brand-logo">
    <span class="header-divider" aria-hidden="true"></span>
    <div class="header-title">
      <span class="header-app">Emergency Party Board</span>
      <span class="header-app-sub">Participant</span>
    </div>
    <div class="header-actions no-print">
      <span class="live-dot" id="live-dot" title="Live"></span>
      <span class="user-chip" id="user-chip"></span>
      <button class="plan-btn" id="btn-plan" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/>
          <path d="M12 7v5M5 17v-5h14v5"/></svg>
        <span>Plan</span>
      </button>
      <button class="hdr-btn" id="btn-logout" type="button">Sign out</button>
    </div>
  </div>
</header>

<main class="panel user-page" id="user-main"><div class="empty-state">Loading&hellip;</div></main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Emergency Party Board &middot; Participant</span>
    <span>Your remarks go straight into the session report.</span>
  </div>
</footer>

<div class="toast hidden" id="toast"></div>
<script src="js/api.js"></script>
<script src="js/user.js"></script>
</body>
</html>
